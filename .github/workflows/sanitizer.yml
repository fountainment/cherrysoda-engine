name: Sanitizer

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest

    env:
      SAN_FLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer

    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install build-essential libgl1-mesa-dev x11proto-core-dev libx11-dev libxext-dev libxcursor-dev libxrandr-dev libxfixes-dev libxi-dev

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      # Debug keeps Tracy out of the build (LSan chokes on Tracy's process-level allocators).
      run: >
        cmake $GITHUB_WORKSPACE
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
        -DCMAKE_C_FLAGS="$SAN_FLAGS" -DCMAKE_CXX_FLAGS="$SAN_FLAGS"
        -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

    - name: Build
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake --build . --parallel 10

    - name: Test
      shell: bash
      working-directory: ${{github.workspace}}/build/Tests
      run: >
        TRACY_NO_INVARIANT_CHECK=1
        UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1
        ./AllTests
